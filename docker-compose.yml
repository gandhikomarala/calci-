version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: churn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: churn_admin
      POSTGRES_PASSWORD: churn_secure_password_2026
      POSTGRES_DB: churn_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn_admin -d churn_platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: churn_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: churn_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.development
    ports:
      - "8000:8000"
    volumes:
      - ./data_storage:/var/data/churn_platform

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: churn_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.development
    volumes:
      - ./data_storage:/var/data/churn_platform

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: churn_scheduler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.development
    command: ["celery", "-A", "apps.worker.celery_app:celery_app", "beat", "--loglevel=info"]

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: churn_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: churn_prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.1
    container_name: churn_grafana
    restart: unless-stopped
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
