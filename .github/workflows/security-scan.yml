name: Security Audit & SAST

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unencrypted secrets and keys
        run: |
          echo "Scanning for sensitive credentials..."
          ! grep -rn "BEGIN RSA PRIVATE KEY" . --exclude-dir=.git || exit 1
          ! grep -rn "BEGIN OPENSSH PRIVATE KEY" . --exclude-dir=.git || exit 1
          echo "No private keys detected."

      - name: Audit dependency configurations
        run: |
          if [ -f requirements.txt ]; then
            echo "Scanning requirements.txt..."
            cat requirements.txt
          fi
