[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-ai"
version = "1.0.0"
description = "FinGuard AI: Enterprise Financial Fraud Detection, Risk Intelligence, Investigation & MLOps Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "FinGuard AI Engineering Core Team", email = "core@finguard.ai.internal"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "flower>=2.0.1",
    "scikit-learn>=1.4.1.post1",
    "lightgbm>=4.3.0",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "pyarrow>=15.0.1",
    "shap>=0.45.0",
    "joblib>=1.3.2",
    "scipy>=1.12.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "click>=8.1.7",
    "typer>=0.9.0",
    "rich>=13.7.1",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "jinja2>=3.1.3",
    "boto3>=1.34.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "faker>=24.3.0",
    "locust>=2.24.1",
    "ruff>=0.3.4",
    "black>=24.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
finguard = "apps.cli.main:cli"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "I001", "F401", "E402", "F841"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
